name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # ---------- 1) MSYS2 + GStreamer 工具链 ----------
      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad

      # ---------- 2) 编译 UxPlay ----------
      - name: Build UxPlay
        shell: msys2 {0}
        run: bash build/build-uxplay.sh

      # ---------- 3) 收集可移植 runtime ----------
      - name: Collect portable runtime
        shell: msys2 {0}
        run: bash build/make-runtime.sh

      # ---------- 4) 打包 GUI ----------
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package AirCast.exe
        shell: pwsh
        run: ./build/build-exe.ps1 -Python python

      # ---------- 5) 自检（启动 uxplay 并检查进程存活） ----------
      - name: Self test
        shell: pwsh
        run: |
          # 注意：AirCast.exe 是 GUI 子系统程序，直接 & 调用不会等待其结束，必须显式 WaitForExit
          $p = Start-Process -FilePath ./dist/AirCast/AirCast.exe -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(180000)) {
            $p.Kill()
            throw "自检超时（180s）"
          }
          "exit code = $($p.ExitCode)"
          if (-not (Test-Path ./dist/AirCast/data/selftest.log)) { throw "没有生成 selftest.log" }
          Get-Content ./dist/AirCast/data/selftest.log
          if (-not (Select-String -Path ./dist/AirCast/data/selftest.log -Pattern 'SELFTEST OK' -Quiet)) {
            throw "自检未通过"
          }
          if ($p.ExitCode -ne 0) { throw "自检退出码 $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: AirCast-Windows-x64
          path: AirCast-Windows-x64.zip
          if-no-files-found: error

      # ---------- 6) 打 tag 时自动发布 ----------
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AirCast ${{ github.ref_name }} — Windows x64 便携包
          files: AirCast-Windows-x64.zip
          generate_release_notes: true
          body: |
            Windows x64 便携包，**解压即用**（无需安装 Python / Bonjour / GStreamer）。本包由 GitHub Actions 从本仓库源码自动构建。

            1. 下载 `AirCast-Windows-x64.zip`，解压到任意目录（`AirCast.exe`、`_internal\`、`runtime\` 必须同级）
            2. 双击 `AirCast.exe` → 点「▶ 启动接收端」
            3. iPhone/iPad：控制中心 → **屏幕镜像** → 选你的设备名

            想启动即开播：`AirCast.exe --autostart`
            自检排错：`AirCast.exe --selftest`（约 8 秒后写入 `data\selftest.log`，末尾应有 `SELFTEST OK`）

            ### 内容
            - 界面外壳：本仓库 `app/aircast.py`（MIT）
            - AirPlay 内核：[UxPlay 1.74](https://github.com/FDH2/UxPlay)（**GPLv3**，`-DUSE_MDNS=1` 内置 mDNS，无需装 Bonjour）
            - 渲染：GStreamer 1.28 + gst-libav（**LGPL**），D3D12 视频硬解 + WASAPI 音频输出

            ### 已知限制
            - Apple TV App 的 DRM 影片无法投（仅声音）——所有开源接收端共同限制
            - 不支持 AirPlay 2 多房间音频；HLS（YouTube 类）视频默认未启用
            - 电脑需与手机同一局域网；防火墙需放行（界面里有「配置防火墙」按钮）

            > 内含 GPLv3/LGPL 第三方二进制，许可证与源码链接见仓库 `THIRD-PARTY.md`。

